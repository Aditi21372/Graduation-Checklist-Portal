<!-- student-form.component.html -->
<div class="container" *ngIf="showContent">
    
    <form (ngSubmit)="onSubmit()" class="form">
      <div class="form-group">
        <label for="rollNumber">Enter your roll number below:</label>
        <input
          type="number"
          id="rollNumber"
          name="rollNumber"
          [(ngModel)]="studentRollNumber"
          class="form-control"
          required
        />
      </div>
    
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>
