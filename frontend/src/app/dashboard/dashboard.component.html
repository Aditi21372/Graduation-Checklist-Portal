<div class="container">
  <app-student-info
    [rollNumber]="rollNumber"
    [gradStatus]="gradStatus"
  ></app-student-info>
  <app-checklist
    [rollNumber]="rollNumber"
    (graduationStatusChanged)="onGraduationStatusChanged($event)"

  <!-- Go Back button -->
  <div>
    <button (click)="goBack()">← Go Back</button>
  </div>
</div>
