<div class="go-back-button">
  <button (click)="goBack()">← Go Back</button>
</div>

<div class="container">
  <mat-card class="custom-toolbar">
    <div class="center-horizontally">
      <h2><b>Student Details</b></h2>
    </div>
    <div class="student-info">
      <div><strong>Name:</strong> {{ studentName }}</div>
      <div><strong>Program:</strong> {{ program }}</div>
      <div><strong>Roll Number:</strong> {{ rollNumber }}</div>
    </div>
  </mat-card>
</div>

<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="dataSourceTwo" class="mat-elevation-z8">
      <!-- Define your table columns here -->
      <ng-container matColumnDef="requirement">
        <th mat-header-cell *matHeaderCellDef>Requirement</th>
        <td mat-cell *matCellDef="let element">{{ element.requirement }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">{{ element.status }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card-content>
</mat-card>
