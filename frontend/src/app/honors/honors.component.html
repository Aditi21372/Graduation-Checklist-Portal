  <!-- Go Back button -->

  <div>
    <button (click)="goBack()">← Go Back</button>
  </div>
  <div class="container">
    <mat-card class="custom-toolbar">
      <div class="center-horizontally">
        <h2><b>Student Details</b></h2>
      </div>
      <div class="student-info">
        <div>
          <strong>Name:</strong> {{studentName}}
        </div>
        <div>
          <strong>Program:</strong> {{program}}
        </div>
        <div>
          <strong>Roll Number:</strong> {{ rollNumber }}
        </div>
      </div>
    </mat-card>
  </div>
<mat-card>
    <div class="center-horizontally">
      <h1><b>Honors Details</b></h1>
    </div>
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="rule">
        <th mat-header-cell *matHeaderCellDef>Course</th>
        <td mat-cell *matCellDef="let element">{{ element.rule }}</td>
      </ng-container>

      <ng-container matColumnDef="value">
        <th mat-header-cell *matHeaderCellDef>Value</th>
        <td mat-cell *matCellDef="let element">{{ element.value }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">{{ element.status }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        [ngClass]="{ 'red-row': row.status !== 'Yes' }"
      ></tr>
    </table>
</mat-card>
