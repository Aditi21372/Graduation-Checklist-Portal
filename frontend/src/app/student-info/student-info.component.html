<!-- Your component's HTML file -->

<mat-card class="center-card">
  <mat-card-content>
    <h2>Student Information</h2>
    <p>Roll Number: {{ rollNumber }}</p>
    <p>Name: {{ studentName }}</p>
    <p>Program: {{ branch }}</p>

    <p
      [ngClass]="{
        graduated: gradStatus === true,
        incomplete: gradStatus === false
      }"
    >
      <strong>
        Graduation Status:
        <ng-container *ngIf="gradStatus === true; else incompleteStatus">
          Graduated
        </ng-container>
        <ng-template #incompleteStatus> Graduation Incomplete </ng-template>
      </strong>
    </p>

    <!-- Buttons -->
    <button mat-raised-button color="primary" (click)="showSummary()">
      Show Summary
    </button>

    <button
      mat-raised-button
      color="accent"
      [routerLink]="['/cgpa-page', rollNumber]"
    >
      Show Semester Wise CGPA
    </button>
  </mat-card-content>
</mat-card>
