<div class="container" *ngIf="showContent">
  <form (ngSubmit)="onSubmit()" class="form">
    <div class="form-group">
      <label for="rollNumber">Student's Roll Number</label>
      <input
        type="number"
        id="rollNumber"
        name="rollNumber"
        [(ngModel)]="studentRollNumber"
        class="form-control"
        required
      />
    </div>

    <div *ngIf="showMessage" class="error-message">
      {{ showMessage }}
    </div>

    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>

<div class="table" *ngIf="showFailCourses">
  <div>
    <h3>Select a course to Replace</h3>
    <table>
      <thead>
        <tr>
          <th>Select</th>
          <th>Course Code</th>
          <th>Failed</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let course of failCoursesList; let i = index">
          <td>
            <input
              type="radio"
              name="selectedFailCourse"
              id="radio{{ i }}"
              [(ngModel)]="selectedFailCourse"
              [value]="i"
            />
          </td>
          <td>{{ course["courseCode"] }}</td>
          <td>{{ course.count }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <button (click)="submitFailedSelection()">Submit Selection</button>
</div>

<div class="container" *ngIf="showSubCourses">
  <div>
    <h3>Select a course to Replace with</h3>
    <table>
      <thead>
        <tr>
          <th>Select</th>
          <th>Course Code</th>
          <th>Course</th>
          <th>Grade</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let course of substituteCoursesList; let i = index">
          <td>
            <input
              type="radio"
              name="selectedSubstituteCourse"
              id="radio{{ i }}"
              [(ngModel)]="selectedSubstituteCourse"
              [value]="i"
            />
          </td>
          <td>{{ course["courseCode"] }}</td>
          <td>{{ course.course }}</td>
          <td>{{ course.grade }}</td>
        </tr>
      </tbody>
    </table>
  </div>
  <button (click)="submitSubstituteSelection()">Submit Selection</button>
</div>

<div class="go-back-button">
  <button (click)="goBack()">← Go Back</button>
</div>
