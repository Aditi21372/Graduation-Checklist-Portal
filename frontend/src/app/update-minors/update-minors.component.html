<div class="container">
  <form (ngSubmit)="onSubmit()" class="form">
    <div>
      <label for="rollNumber">Student's Roll Number</label>
      <input
        type="number"
        id="rollNumber"
        name="rollNumber"
        [(ngModel)]="studentRollNumber"
        class="form-group-2"
        required
      />
    </div>

    <div>
      <label for="minors">Select Minors </label>
      <select
        id="minors"
        name="minors"
        [(ngModel)]="selectedMinors"
        class="form-group-2"
        required
      >
        <option *ngFor="let minor of minors" [value]="minor">
          {{ minor }}
        </option>
      </select>
    </div>

    <div>
      <label for="add">Add? </label>
      <select
        id="add"
        name="add"
        [(ngModel)]="selectedType"
        required
        class="form-group-2"
      >
        <option *ngFor="let type of add" [value]="type">{{ type }}</option>
      </select>
    </div>

    <div *ngIf="showMessage" class="error-message">
      {{ showMessage }}
    </div>

    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>

<div class="container" *ngIf="success">
  <div *ngIf="data.length > 0; else noCourses">
    <h3>Select a course to include in your minor</h3>
    <table>
      <thead>
        <tr>
          <th>Select</th>
          <th>Course Code</th>
          <th>Course Name</th>
          <th>Semester</th>
          <th>Credits</th>
          <th>Grade</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let course of data; let i = index">
          <td>
            <input
              type="radio"
              name="selectedCourse"
              id="radio{{ i }}"
              [(ngModel)]="selectedCourseIndex"
              [value]="i"
            />
          </td>
          <td>{{ course["Course Code"] }}</td>
          <td>{{ course.Course }}</td>
          <td>{{ course["Batch / Term Code"] }}</td>
          <td>{{ course.Credit }}</td>
          <td>{{ course.Grade }}</td>
        </tr>
      </tbody>
    </table>

    <button (click)="submitSelection()">Submit Selection</button>
  </div>

  <ng-template #noCourses>
    <p>No IP's available.</p>
  </ng-template>
</div>

<div class="go-back-button">
  <button (click)="goBack()">← Go Back</button>
</div>
