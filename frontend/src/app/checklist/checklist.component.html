<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="dataSourceTwo">
      <!-- Define your table columns here -->
      <ng-container matColumnDef="rule">
        <th mat-header-cell *matHeaderCellDef>Requirement</th>
        <td mat-cell *matCellDef="let element">{{ element.rule }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let element">{{ element.status }}</td>
      </ng-container>

      <ng-container matColumnDef="credits">
        <th mat-header-cell *matHeaderCellDef>Credits</th>
        <td mat-cell *matCellDef="let element">{{ element.credits }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="button-column"></th>
        <td mat-cell *matCellDef="let element" class="button-column">
          <button mat-button (click)="navigateToPage(element)">
            {{ element.button_text }}
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumn"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumn"
        [ngClass]="{ 'red-row': row.status === false }"
      ></tr>
    </table>
  </mat-card-content>
</mat-card>
